[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "actionhound"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.scripts]
actionhound = "actionhound.cli:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
