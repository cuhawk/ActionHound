[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "actionhound"
version = "0.1.0"
description = "Static CI/CD trust and supply-chain scanner"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
actionhound = "actionhound.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
