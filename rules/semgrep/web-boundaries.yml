rules:
  - id: express-untrusted-redirect
    languages: [javascript, typescript]
    severity: WARNING
    message: Resolve OAuth redirect destinations from a registered exact-match allowlist.
    pattern: $RES.redirect($REQ.query.redirect_uri)
  - id: fastapi-forwarded-redirect
    languages: [python]
    severity: WARNING
    message: Resolve OAuth redirect destinations from a registered exact-match allowlist.
    pattern: RedirectResponse(redirect_uri, ...)
  - id: static-oauth-state
    languages: [javascript, typescript]
    severity: WARNING
    message: Bind a unique OAuth state to the initiating session and verify it on callback.
    patterns:
      - pattern: new URLSearchParams({..., state: $STATE, ...})
      - metavariable-regex:
          metavariable: $STATE
          regex: ^["']
  - id: jwt-signature-disabled
    languages: [python]
    severity: ERROR
    message: Verify token signatures with trusted issuer keys and an algorithm allowlist.
    pattern: jwt.decode(..., options={"verify_signature": False, ...}, ...)
  - id: express-object-access-review
    languages: [javascript, typescript]
    severity: WARNING
    message: Verify object access against the caller's tenant and ownership policy.
    pattern: $MODEL.findById($REQ.params.$ID)
  - id: fastapi-object-access-review
    languages: [python]
    severity: WARNING
    message: Verify object access against the caller's tenant and ownership policy.
    pattern: $SESSION.get($MODEL, object_id)
  - id: express-fetch-request-url
    languages: [javascript, typescript]
    severity: ERROR
    message: Resolve outbound destinations through a strict allowlist.
    pattern: fetch($REQ.query.$URL, ...)
  - id: python-fetch-request-url
    languages: [python]
    severity: WARNING
    message: Resolve outbound destinations through a strict allowlist.
    pattern-either:
      - pattern: requests.get(request.query_params[$URL], ...)
      - pattern: httpx.get(request.query_params[$URL], ...)
